
# BG Agro - FAMA Price Tracker
# Automated FAMA Data Collection and GitHub Pages Deployment

name: BG Agro - Auto Update FAMA Prices

on:
  schedule:
    # MYT 09:37, 11:37, 13:37, 15:37, 17:37, 19:37, 21:37.
    # Use explicit UTC (MYT - 8 hours) after missed/delayed local-time
    # schedules on 2026-11-06. GitHub's cron is still best-effort.
    - cron: "37 1,3,5,7,9,11,13 * * *"
    # MYT 23:37: verify the entire upstream rolling window once nightly.
    - cron: "37 15 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Automatically update the website when code changes
  push:
    branches:
      - master

concurrency:
  group: bg-agro-fama
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ==========================================
  # JOB 1: SCRAPE AND PREPARE FAMA DATA
  # ==========================================

  scrape:
    name: Scrape FAMA Data
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ github.event_name != 'schedule' || steps.commit_data.outputs.has_changes == 'true' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record actual execution time and trigger
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          echo "Trigger: ${TRIGGER_EVENT}"
          echo "Scheduled cron: ${TRIGGER_CRON:-manual-or-push}"
          echo "Started UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Started MYT: $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M:%S MYT')"

      - name: Run backend tests
        # Source-data polls reuse the already-tested code; code pushes and
        # manual runs execute the entire regression suite.
        if: github.event_name != 'schedule'
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Setup Node.js for dashboard tests
        if: github.event_name != 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run V3 and V3.1 browser-logic tests
        if: github.event_name != 'schedule'
        run: node --test tests/test_v3_engine.mjs tests/test_v3_backup.mjs tests/test_v3_ui_structure.mjs tests/test_pdf_export.mjs

      - name: Scrape rolling FAMA price window
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          # Check recent survey days frequently. The late-night full scan
          # still captures older backfills and corrections within FAMA's
          # rolling source window. Manual/push runs always scan everything.
          if [ -z "$TRIGGER_CRON" ] || [ "$TRIGGER_CRON" = "37 15 * * *" ]; then
            echo "Full rolling-window verification."
            python -m scraper.scrape
          else
            echo "Fast update: latest five available FAMA survey dates."
            python -m scraper.scrape --limit-dates 5
          fi

      # V3 Phase 1: prevent any malformed archive or accidental historical
      # priceid/file deletion from entering the published Git history.
      - name: Verify original FAMA CSV archive and preservation
        run: python -m scripts.archive_guard --against-ref HEAD

      - name: Rebuild legacy and versioned V3 dashboard JSON when needed
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          # An automated data commit triggers this workflow again through
          # `push`. Do not rebuild on every push just to change timestamps:
          # that would create an endless commit -> push -> commit loop.
          # Rebuild whenever archived CSVs changed, an aggregate engine changed
          # in this commit, generated V3 files are absent, or a human explicitly
          # requested a workflow_dispatch refresh.
          if [ "$TRIGGER_EVENT" != "workflow_dispatch" ] && \
             git diff --quiet -- data/daily && \
             [ -z "$(git ls-files --others --exclude-standard -- data/daily)" ] && \
             git diff --quiet HEAD^ HEAD -- scraper/aggregate.py scraper/aggregate_v3.py scraper/market_math.py && \
             python -c 'import json,pathlib,sys; p=pathlib.Path("site/data/meta.json"); data=json.loads(p.read_text(encoding="utf-8")) if p.is_file() else {}; required=("site/data/v3/overview.json","site/data/v3/history-index.json","site/data/v3/health.json"); sys.exit(0 if data.get("archive_versions") and all(pathlib.Path(f).is_file() for f in required) else 1)'; then
            echo "Archive CSVs unchanged; reusing tested JSON aggregates."
          else
            python -m scraper.aggregate
            python -m scraper.aggregate_v3 --history-dir site/data/v3/history
            python -m scripts.validate_v3
            python -m scripts.health_v3
          fi

      # A successful scrape is not necessarily a new daily price publication.
      # Show a warning and a separate GitHub summary when FAMA's data is old,
      # without discarding valid archive rows or preventing Pages deployment.
      - name: Audit latest FAMA survey date
        run: python -m scripts.check_freshness

      - name: Commit updated FAMA data
        id: commit_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data site/data

          # Ignore commits containing only the generated timestamp
          if git diff --cached --quiet -- ':!site/data/meta.json'; then

            echo "No new FAMA price changes detected."
            echo "Skipping data commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"

            git reset -q

          else

            echo "New FAMA data detected."

            git commit -m "data: scrape $(date -u +'%Y-%m-%d %H:%M') UTC"

            pushed=0

            for i in 1 2 3; do

              if git pull --rebase origin master && git push origin master; then
                echo "Successfully pushed updated FAMA data."
                pushed=1
                break
              fi

              echo "Push attempt $i failed."
              sleep $((i * 10))

            done

            if [ "$pushed" -ne 1 ]; then
              echo "ERROR: Failed to push FAMA data."
              exit 1
            fi

            echo "has_changes=true" >> "$GITHUB_OUTPUT"

          fi

      # Prepare GitHub Pages
      - name: Configure GitHub Pages
        if: github.event_name != 'schedule' || steps.commit_data.outputs.has_changes == 'true'
        uses: actions/configure-pages@v5

      # Upload dashboard and generated JSON
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'schedule' || steps.commit_data.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # ==========================================
  # JOB 2: DEPLOY DASHBOARD
  # ==========================================

  deploy:
    name: Deploy BG Agro Dashboard

    needs: scrape
    if: needs.scrape.outputs.should_deploy == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
