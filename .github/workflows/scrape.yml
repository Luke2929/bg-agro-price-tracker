# BG Agro Private FAMA Price Tracker

name: BG Agro - Auto Update FAMA Prices

on:
  schedule:
    # 12:30 MYT and 23:00 MYT (UTC+8)
    - cron: "30 4 * * *"
    - cron: "0 15 * * *"

  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape rolling window
        run: python -m scraper.scrape

      - name: Rebuild dashboard data
        run: python -m scraper.aggregate

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data site/data

          # Skip commit when only meta.json timestamp changes
          if git diff --cached --quiet -- ':!site/data/meta.json'; then

            echo "No new FAMA price data detected."
            echo "Skipping commit."

            git reset -q

          else

            echo "New FAMA price data detected."

            git commit -m "data: scrape $(date -u +'%Y-%m-%d %H:%M') UTC"

            pushed=0

            for i in 1 2 3; do

              if git pull --rebase origin master && git push origin master; then
                echo "Successfully pushed updated data."
                pushed=1
                break
              fi

              echo "Push attempt $i failed; retrying..."
              sleep $((i * 10))

            done

            if [ "$pushed" -ne 1 ]; then
              echo "ERROR: Failed to push updated FAMA data."
              exit 1
            fi

          fi
