
# BG Agro - FAMA Price Tracker
# Automated FAMA Data Collection and GitHub Pages Deployment

name: BG Agro - Auto Update FAMA Prices

on:
  schedule:
    # Malaysia Time (UTC+8): 1:15 PM, 5:15 PM, 9:15 PM, 11:15 PM.
    # GitHub's scheduler may delay any of these runs; retries give late FAMA
    # entries another chance to reach the dashboard on the same day.
    - cron: "15 5 * * *"
    - cron: "15 9 * * *"
    - cron: "15 13 * * *"
    - cron: "15 15 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Automatically update the website when code changes
  push:
    branches:
      - master

concurrency:
  group: bg-agro-fama
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ==========================================
  # JOB 1: SCRAPE AND PREPARE FAMA DATA
  # ==========================================

  scrape:
    name: Scrape FAMA Data
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record actual execution time and trigger
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          echo "Trigger: ${TRIGGER_EVENT}"
          echo "Scheduled cron: ${TRIGGER_CRON:-manual-or-push}"
          echo "Started UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Started MYT: $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M:%S MYT')"

      - name: Run backend tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Setup Node.js for dashboard tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Algorithm V2 browser-logic tests
        run: node --test tests/test_dashboard_algorithm.cjs

      - name: Scrape rolling FAMA price window
        run: python -m scraper.scrape

      - name: Rebuild dashboard JSON
        run: python -m scraper.aggregate

      # A successful scrape is not necessarily a new daily price publication.
      # Show a warning and a separate GitHub summary when FAMA's data is old,
      # without discarding valid archive rows or preventing Pages deployment.
      - name: Audit latest FAMA survey date
        run: python -m scripts.check_freshness

      - name: Commit updated FAMA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data site/data

          # Ignore commits containing only the generated timestamp
          if git diff --cached --quiet -- ':!site/data/meta.json'; then

            echo "No new FAMA price changes detected."
            echo "Skipping data commit."

            git reset -q

          else

            echo "New FAMA data detected."

            git commit -m "data: scrape $(date -u +'%Y-%m-%d %H:%M') UTC"

            pushed=0

            for i in 1 2 3; do

              if git pull --rebase origin master && git push origin master; then
                echo "Successfully pushed updated FAMA data."
                pushed=1
                break
              fi

              echo "Push attempt $i failed."
              sleep $((i * 10))

            done

            if [ "$pushed" -ne 1 ]; then
              echo "ERROR: Failed to push FAMA data."
              exit 1
            fi

          fi

      # Prepare GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Upload dashboard and generated JSON
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # ==========================================
  # JOB 2: DEPLOY DASHBOARD
  # ==========================================

  deploy:
    name: Deploy BG Agro Dashboard

    needs: scrape

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
